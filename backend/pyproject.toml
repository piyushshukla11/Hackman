[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-core"
version = "0.1.0"
description = "PRISM — AI-powered review intelligence platform backend"
requires-python = ">=3.12"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",

    # --- Data validation ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.2",

    # --- Auth ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # --- HTTP client ---
    "httpx>=0.27.0",

    # --- ML / NLP ---
    "vaderSentiment>=3.3.2",
    "onnxruntime>=1.19.0",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.19.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",

    # --- YAML / config ---
    "pyyaml>=6.0.1",

    # --- PDF generation ---
    "weasyprint>=62.0",

    # --- Async utilities ---
    "anyio>=4.4.0",

    # --- File handling ---
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "faker>=25.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["prism_core", "api", "workflows"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
